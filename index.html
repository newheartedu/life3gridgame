<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life3 擁抱九宮格</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
    }
    </script>

    <!-- 3. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        #root:empty { display: none; }
    </style>
</head>
<body class="bg-orange-50">

    <div id="root"></div>

    <!-- 4. 主要程式邏輯 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { 
            getFirestore, doc, setDoc, getDoc, getDocs, collection, 
            onSnapshot, query, where, updateDoc, deleteDoc 
        } from 'firebase/firestore';
        import { 
            getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, 
            signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail
        } from 'firebase/auth';
        import { 
            CheckCircle2, User, ShieldCheck, LogOut, LayoutGrid, Loader2, 
            ChevronRight, ArrowLeft, Trophy, BarChart3, Users, KeyRound, 
            AlertTriangle, Mail, Copy, Gift, X, Lock, Trash2
        } from 'lucide-react';

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyByt0w_VbguiifETHkpUyJoxuCS_LyIVpY",
            authDomain: "life3grid.firebaseapp.com",
            projectId: "life3grid",
            storageBucket: "life3grid.firebasestorage.app",
            messagingSenderId: "1091079634646",
            appId: "1:1091079634646:web:ca46d336d28d6690f6d377"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'life3-mission-grid-v2'; // 保持相同的 appId 讓原用戶免重新註冊

        // --- 常數設定 ---
        const ALLIANCES = ['夢幻', 'Favor', '心不老', '顏值', 'Revival'];
        
        // --- 擁抱九宮格 全新題目 (加入密碼鎖定) ---
        const DEFAULT_TASKS = [
            { title: "1️⃣感恩不要憋 🫶！", desc: "不要當冷漠 NPC👉🏽現在打開手機，傳一則真心感謝的訊息給祈翰哥／嘉華姊／你的小組長。" },
            { title: "2️⃣我今年就是燃 🔥！", desc: "不要低調，直接宣告👉🏽去 Life3 粉專貼文底下留言：「我值得＿＿，今年我可以＿＿！」" },
            { title: "3️⃣就要跟你拍一張 📷！", desc: "這不是打卡，是紀念「我們一起」的時刻👉🏽跟小組或 Life3 的人拍一張照片，分享到小組群組、Life3大群（也可丟限動）。", password: "embrace", lockedTitle: "3.（隱藏題）" },
            { title: "4️⃣友情補給任務 ！", desc: "今天你當別人的充電器👉🏽選一個朋友，準備一份小禮物。直接去探班／探訪，給他一個驚喜。" },
            { title: "5️⃣社牛模式啟動 🐮🚀！", desc: "不用完美開場白，一句「要不要一起來？」就夠了👉🏽勇敢一次，邀一位朋友來 3/21 的 Life3 聚會。", password: "mission", lockedTitle: "5.（隱藏題）" },
            { title: "6️⃣感恩不是客套，是真的 ！", desc: "當你說出來，空氣都會變溫柔。在小組裡👉🏽分享一件你真心感謝的事。" },
            { title: "7️⃣先追再說，不然會後悔 👀！", desc: "有些影響力，是從一個「追蹤」開始的👉🏽追蹤《擁抱計畫》IG" },
            { title: "8️⃣零食外交官 ！", desc: "分享的瞬間，關係直接升溫👉🏽準備一份零食或飲料分享給一位 Life3 家人" },
            { title: "9️⃣拯救世界超展開 ！", desc: "也許你不是超級英雄，但你可以幫助更多人遇見希望👉🏽轉傳或分享百隊志工隊報名連結", password: "love", lockedTitle: "9.（隱藏題）" }
        ];

        const ADMIN_CREDENTIALS = {
            account: 'life3',
            password: 'life3'
        };

        // --- 共用組件 ---

        const LoadingScreen = ({ message = "系統連線中..." }) => (
            <div className="flex flex-col items-center justify-center min-h-screen bg-orange-50">
                <Loader2 className="w-10 h-10 text-orange-500 animate-spin mb-4" />
                <p className="text-orange-700 font-black tracking-tight">{message}</p>
            </div>
        );

        const ErrorScreen = ({ error, onRetry }) => {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-red-50 p-6">
                    <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-red-100 text-center">
                        <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <AlertTriangle className="text-red-600 w-8 h-8" />
                        </div>
                        <h2 className="text-2xl font-black text-slate-800 mb-2">發生錯誤</h2>
                        <p className="text-slate-600 font-bold mb-6 text-sm leading-relaxed">
                            {error}
                        </p>
                        <button 
                            onClick={onRetry || (() => window.location.reload())}
                            className="w-full bg-red-500 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-red-600 transition-all active:scale-95 flex items-center justify-center gap-2 mt-4"
                        >
                            我已設定完成，重試
                        </button>
                    </div>
                </div>
            );
        };

        // --- 主程式元件 ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('auth');
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [profile, setProfile] = useState(null);
            const [userTasks, setUserTasks] = useState(new Array(9).fill(false));
            const [allUsers, setAllUsers] = useState([]);
            const [selectedUser, setSelectedUser] = useState(null);
            const [adminTab, setAdminTab] = useState('rank');

            // Modal 及解鎖狀態
            const [selectedTaskIndex, setSelectedTaskIndex] = useState(null);
            const [showVoucher, setShowVoucher] = useState(false);
            const [hasSeenVoucher, setHasSeenVoucher] = useState(false);
            const [sessionUnlocked, setSessionUnlocked] = useState(new Set()); // 記錄本次瀏覽解鎖的題目
            
            // 密碼彈窗狀態
            const [unlockPromptIndex, setUnlockPromptIndex] = useState(null);
            const [unlockPassword, setUnlockPassword] = useState('');
            const [unlockError, setUnlockError] = useState('');

            // 刪除帳號狀態
            const [deleteConfirmUser, setDeleteConfirmUser] = useState(null);
            const [isDeleting, setIsDeleting] = useState(false);

            // 表單狀態
            const [formData, setFormData] = useState({ 
                name: '', 
                email: '',
                alliance: ALLIANCES[0], 
                group: '', 
                password: '' 
            });
            
            const [loginData, setLoginData] = useState({ email: '', password: '' });
            const [adminLoginData, setAdminLoginData] = useState({ account: '', password: '' });
            const [forgotData, setForgotData] = useState({ email: '' });
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState('');

            // 確認任務是否被鎖定的輔助函式
            const checkIsLocked = (task, index) => {
                if (!task.password) return false; // 沒有設密碼的不用鎖
                if (userTasks[index]) return false; // 已經完成的不再鎖
                if (sessionUnlocked.has(index)) return false; // 這次登入已經解鎖過的不鎖
                return true;
            };

            // 1. 身份驗證監聽
            useEffect(() => {
                let mounted = true;
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    if (!mounted) return;
                    setUser(u);
                    
                    if (u) {
                        try {
                            const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', u.uid);
                            const profileSnap = await getDoc(profileRef);
                            
                            if (profileSnap.exists()) {
                                const data = profileSnap.data();
                                setProfile(data);
                                setUserTasks(data.tasks || new Array(9).fill(false));
                                if (['auth', 'register'].includes(view)) {
                                    setView('grid');
                                }
                            } else {
                                setProfile(null);
                            }
                        } catch (err) {
                            console.warn("Profile fetch error handled gracefully.");
                        }
                    }
                    setLoading(false);
                });
                return () => {
                    mounted = false;
                    unsubscribe();
                };
            }, [view]); 

            // 2. 破關兌換券觸發監聽
            useEffect(() => {
                if (view === 'grid' && profile && userTasks) {
                    const allDone = userTasks.length === 9 && userTasks.every(v => v === true);
                    if (allDone && !hasSeenVoucher) {
                        const timer = setTimeout(() => {
                            setShowVoucher(true);
                            setHasSeenVoucher(true);
                        }, 500); // 稍微延遲讓使用者看到最後一格打勾
                        return () => clearTimeout(timer);
                    }
                }
            }, [userTasks, profile, view, hasSeenVoucher]);

            // 3. 管理者數據監聽
            useEffect(() => {
                if (view !== 'admin_dashboard' || !user) return;

                const profilesCol = collection(db, 'artifacts', appId, 'public', 'data', 'profiles');
                const unsubscribe = onSnapshot(profilesCol, (snapshot) => {
                    const users = [];
                    snapshot.forEach((doc) => {
                        users.push({ id: doc.id, ...doc.data() });
                    });
                    setAllUsers(users);
                }, (err) => {
                    console.warn("Admin dashboard sync error handled.");
                });
                return () => unsubscribe();
            }, [view, user]);

            // --- 統計排行榜 ---
            const allianceStats = useMemo(() => {
                const stats = ALLIANCES.map(name => ({
                    name,
                    userCount: 0,
                    completedTasks: 0,
                    totalPossibleTasks: 0,
                    completionRate: 0
                }));

                allUsers.forEach(u => {
                    const idx = ALLIANCES.indexOf(u.alliance);
                    if (idx !== -1) {
                        stats[idx].userCount += 1;
                        const done = u.tasks ? u.tasks.filter(v => v).length : 0;
                        stats[idx].completedTasks += done;
                        stats[idx].totalPossibleTasks += 9;
                    }
                });

                return stats.map(s => ({
                    ...s,
                    completionRate: s.totalPossibleTasks > 0 ? (s.completedTasks / s.totalPossibleTasks) * 100 : 0
                })).sort((a, b) => b.completionRate - a.completionRate);
            }, [allUsers]);

            // --- 核心處理功能 ---

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.email || !formData.password || !formData.group) {
                    setError('請填寫完整資訊');
                    return;
                }
                setError('');
                setLoading(true);
                
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, formData.email, formData.password);
                    const newUser = userCredential.user;

                    const profileData = {
                        uid: newUser.uid,
                        name: formData.name,
                        loginName: formData.email, 
                        email: formData.email,
                        alliance: formData.alliance,
                        group: formData.group,
                        tasks: new Array(9).fill(false),
                        updatedAt: Date.now(),
                        authProvider: 'email'
                    };

                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', newUser.uid), profileData);
                    
                    setProfile(profileData);
                    setUserTasks(profileData.tasks);
                    setView('grid');
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') {
                        setError('此 Email 已被註冊');
                    } else if (err.code === 'auth/weak-password') {
                        setError('密碼長度至少需 6 個字元');
                    } else {
                        setError(`註冊失敗: ${err.message}`);
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                
                if (!loginData.email || !loginData.password) {
                    setError('請輸入 Email 和密碼');
                    return;
                }

                setLoading(true);
                try {
                    await signInWithEmailAndPassword(auth, loginData.email, loginData.password);
                } catch (err) {
                    if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                        setError('帳號或密碼錯誤');
                    } else if (err.code === 'auth/too-many-requests') {
                        setError('登入嘗試次數過多，請稍後再試');
                    } else {
                        setError(`登入失敗: ${err.message}`);
                    }
                    setLoading(false);
                }
            };

            const handleForgotPassword = async (e) => {
                e.preventDefault();
                setError('');
                setSuccessMsg('');
                
                if (!forgotData.email) {
                    setError('請輸入 Email');
                    return;
                }
                
                setLoading(true);
                try {
                    await sendPasswordResetEmail(auth, forgotData.email);
                    setSuccessMsg('密碼重設信件已寄出！請至信箱點擊連結設定新密碼。');
                    setForgotData({ email: '' }); 
                } catch (err) {
                    if (err.code === 'auth/invalid-email') {
                        setError('Email 格式錯誤');
                    } else {
                        setError('找不到此 Email 的註冊資料或發送失敗');
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleToggleTask = async (index) => {
                if (!profile || !user) return;
                const newTasks = [...userTasks];
                newTasks[index] = !newTasks[index];
                setUserTasks(newTasks);
                try {
                    const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', user.uid);
                    await updateDoc(profileRef, {
                        tasks: newTasks,
                        updatedAt: Date.now()
                    });
                } catch (err) {
                    // 隱藏錯誤訊息防干擾
                }
            };

            const handleUnlockSubmit = () => {
                if (unlockPromptIndex === null) return;
                
                const task = DEFAULT_TASKS[unlockPromptIndex];
                // 轉小寫比對，並去除前後空白，提升使用者體驗
                if (unlockPassword.trim().toLowerCase() === task.password.toLowerCase()) {
                    const newSet = new Set(sessionUnlocked);
                    newSet.add(unlockPromptIndex);
                    setSessionUnlocked(newSet);
                    
                    const openedIdx = unlockPromptIndex;
                    setUnlockPromptIndex(null);
                    setUnlockPassword('');
                    setUnlockError('');
                    setSelectedTaskIndex(openedIdx); // 解鎖成功直接打開任務面板
                } else {
                    setUnlockError('密碼錯誤，請再試一次！');
                }
            };

            const handleDeleteUser = async () => {
                if (!deleteConfirmUser) return;
                setIsDeleting(true);
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', deleteConfirmUser.id));
                    setDeleteConfirmUser(null);
                    setSelectedUser(null); // 刪除成功後退回列表
                } catch (err) {
                    console.error("Delete failed", err);
                } finally {
                    setIsDeleting(false);
                }
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if (adminLoginData.account === ADMIN_CREDENTIALS.account && 
                    adminLoginData.password === ADMIN_CREDENTIALS.password) {
                    setLoading(true);
                    try {
                        if (!auth.currentUser) {
                           await signInAnonymously(auth);
                        }
                        setView('admin_dashboard');
                        setError('');
                    } catch (err) {
                        setError('後台連線驗證失敗');
                    } finally {
                        setLoading(false);
                    }
                } else {
                    setError('管理者帳號或密碼錯誤');
                }
            };

            const logout = async () => {
                setLoading(true);
                try {
                    await signOut(auth);
                    setProfile(null);
                    setUserTasks(new Array(9).fill(false));
                    setSelectedUser(null);
                    setAllUsers([]);
                    setError('');
                    setSuccessMsg('');
                    setHasSeenVoucher(false);
                    setSessionUnlocked(new Set());
                    setUnlockPromptIndex(null);
                    setLoginData({ email: '', password: '' });
                    setView('auth');
                } catch (err) {
                    // 隱藏登出失敗錯誤
                } finally {
                    setLoading(false);
                }
            };

            if (authError) return <ErrorScreen error={authError} onRetry={() => setAuthError(null)} />;
            if (loading) return <LoadingScreen message="系統處理中..." />;

            return (
                <div className="min-h-screen bg-orange-50 text-slate-800 font-sans selection:bg-orange-200">
                    <header className="bg-white border-b border-orange-100 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white shadow-md">
                                <LayoutGrid size={20} />
                            </div>
                            <h1 className="font-bold text-lg tracking-tight text-slate-700">擁抱九宮格</h1>
                        </div>
                        
                        {(profile || view === 'admin_dashboard' || view === 'admin_login' || view === 'forgot_password') && (
                           <button 
                             onClick={logout} 
                             className="flex items-center gap-1 text-slate-400 hover:text-orange-600 transition-colors px-3 py-1 rounded-full hover:bg-orange-50 font-black"
                           >
                             <span className="text-sm">登出 / 返回</span>
                             <LogOut size={18} />
                           </button>
                        )}
                        
                        {!profile && view === 'auth' && (
                            <button onClick={() => setView('admin_login')} className="text-slate-300 text-[10px] font-black hover:text-slate-500 transition-colors uppercase tracking-widest">
                                Admin
                            </button>
                        )}
                    </header>

                    <main className="max-w-md mx-auto p-6 pb-24">
                        
                        {/* --- 登入頁面 --- */}
                        {view === 'auth' && (
                            <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="text-center space-y-3 pt-8">
                                    <div className="inline-block px-3 py-1 rounded-full bg-orange-100 text-orange-600 text-[10px] font-black tracking-widest uppercase mb-2">Christian Youth</div>
                                    <h2 className="text-4xl font-black text-slate-800 leading-tight">擁抱九宮格</h2>
                                    <p className="text-slate-500 font-medium tracking-tight font-bold">化為行動，完成你的擁抱任務</p>
                                </div>
                                
                                <div className="bg-white p-7 rounded-[2.5rem] shadow-2xl shadow-orange-200/40 border border-orange-100 space-y-6">
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-black text-slate-600 mb-1 ml-1">Email</label>
                                            <input 
                                                type="email" 
                                                className="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-orange-500 focus:bg-white transition-all outline-none font-bold text-lg"
                                                placeholder="name@example.com"
                                                value={loginData.email}
                                                onChange={(e) => setLoginData({...loginData, email: e.target.value})}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-black text-slate-600 mb-1 ml-1 flex justify-between">
                                                密碼
                                                <button type="button" onClick={() => setView('forgot_password')} className="text-xs text-orange-400 hover:text-orange-600 font-bold">忘記密碼？</button>
                                            </label>
                                            <input 
                                                type="password" 
                                                className="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-orange-500 focus:bg-white transition-all outline-none font-bold text-lg"
                                                placeholder="請輸入密碼"
                                                value={loginData.password}
                                                onChange={(e) => setLoginData({...loginData, password: e.target.value})}
                                            />
                                        </div>
                                        
                                        {error && <p className="text-red-500 text-xs text-center font-black bg-red-50 py-2 rounded-lg">{error}</p>}
                                        
                                        <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-orange-300 transition-all active:scale-[0.97] mt-2 flex items-center justify-center gap-2">
                                            <Mail size={18} />
                                            Email 登入
                                        </button>
                                    </form>
                                </div>

                                <div className="text-center">
                                    <button 
                                        onClick={() => setView('register')} 
                                        className="text-slate-400 text-sm font-black hover:text-orange-600 transition-colors"
                                    >
                                        第一次參加？使用 Email 註冊
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* --- 忘記密碼 --- */}
                        {view === 'forgot_password' && (
                           <div className="space-y-8 animate-in fade-in zoom-in-95 duration-500 pt-8">
                                <div className="text-center">
                                     <div className="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                                            <KeyRound className="text-orange-600" />
                                     </div>
                                     <h2 className="text-2xl font-black text-slate-800">找回密碼</h2>
                                     <p className="text-slate-400 text-sm font-bold mt-1">請輸入 Email 進行查詢</p>
                                </div>
                                <form onSubmit={handleForgotPassword} className="space-y-4 bg-white p-7 rounded-[2.5rem] shadow-xl border border-orange-100">
                                    <input 
                                        type="email" 
                                        placeholder="註冊時填寫的 Email"
                                        className="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-orange-500 outline-none font-bold"
                                        value={forgotData.email}
                                        onChange={(e) => setForgotData({...forgotData, email: e.target.value})}
                                    />

                                                <ArrowLeft size={16} /> 返回列表
                                            </button>
                                            <button 
                                                onClick={() => setDeleteConfirmUser(selectedUser)}
                                                className="flex items-center gap-1 text-red-500 font-black hover:text-red-700 transition-colors bg-red-50 px-5 py-3 rounded-2xl shadow-sm border border-red-100"
                                            >
                                                <Trash2 size={16} /> 刪除帳號
                                            </button>
                                        </div>
                                        
                                        <div className="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-2xl">
                                            <div className="text-center mb-8">
                                                <div className="w-20 h-20 bg-orange-100 rounded-[2rem] flex items-center justify-center mx-auto mb-4 rotate-3 shadow-inner">
                                                    <User size={40} className="text-orange-600 -rotate-3" />
                                                </div>
                                                <h3 className="text-3xl font-black text-slate-800">{selectedUser.name}</h3>
                                                <div className="flex flex-col items-center gap-1 mt-2">
                                                     <div className="flex items-center gap-2">
                                                            <span className="px-3 py-1 bg-orange-100 text-orange-600 text-xs font-black rounded-lg">{selectedUser.alliance} 聯盟</span>
                                                            <span className="text-slate-400 text-xs font-black">{selectedUser.group}</span>
                                                     </div>
                                                     <p className="text-[10px] text-slate-300 font-bold mt-1">Email: {selectedUser.email || '未設定'}</p>
                                                     <p className="text-[10px] text-slate-300 font-bold uppercase tracking-tighter leading-none mt-1">帳號: {selectedUser.loginName}</p>
                                                </div>
                                            </div>

                                            <div className="space-y-4">
                                                <p className="text-xs font-black text-slate-400 uppercase mb-4 tracking-[0.2em] text-center">— 任務挑戰詳細進度 —</p>
                                                {/* 管理者後台檢視時，可以直接看到原本的題目內容 */}
                                                {DEFAULT_TASKS.map((task, idx) => {
                                                    return (
                                                        <div key={idx} className={`flex items-start gap-4 p-5 rounded-[1.5rem] border ${selectedUser.tasks && selectedUser.tasks[idx] ? 'bg-green-50/50 border-green-100' : 'bg-slate-50 border-slate-100 opacity-60'}`}>
                                                            {selectedUser.tasks && selectedUser.tasks[idx] 
                                                                ? <CheckCircle2 size={22} className="text-green-500 shrink-0 mt-0.5" />
                                                                : <div className="w-5 h-5 border-2 border-slate-200 rounded-full shrink-0 mt-0.5" />
                                                            }
                                                            <div className="flex flex-col">
                                                                <span className={`text-base font-black ${selectedUser.tasks && selectedUser.tasks[idx] ? 'text-slate-800' : 'text-slate-400'}`}>
                                                                    {task.title} {task.password && <span className="text-[10px] text-orange-500 bg-orange-100 px-2 py-0.5 rounded ml-2 align-middle">密碼題</span>}
                                                                </span>
                                                                <span className="text-xs text-slate-400 mt-1 font-bold">{task.desc}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 刪除確認 Modal */}
                                {deleteConfirmUser && (
                                    <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300" onClick={() => !isDeleting && setDeleteConfirmUser(null)}>
                                        <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-8 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                            <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-6 shadow-inner bg-red-50 text-red-500 mx-auto border border-red-100">
                                                <Trash2 size={32} />
                                            </div>
                                            <h3 className="text-2xl font-black text-slate-800 mb-2 text-center">確定要刪除帳號？</h3>
                                            <p className="text-sm text-slate-500 font-bold mb-8 text-center leading-relaxed">
                                                將永久刪除 <span className="text-red-500 font-black">{deleteConfirmUser.name}</span> 的資料與進度，此動作無法復原。
                                            </p>
                                            <div className="flex gap-3">
                                                <button 
                                                    onClick={() => setDeleteConfirmUser(null)}
                                                    disabled={isDeleting}
                                                    className="flex-1 bg-slate-100 text-slate-600 font-black py-4 rounded-2xl active:scale-95 transition-all disabled:opacity-50"
                                                >
                                                    取消
                                                </button>
                                                <button 
                                                    onClick={handleDeleteUser}
                                                    disabled={isDeleting}
                                                    className="flex-1 bg-red-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-red-200 hover:bg-red-600 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                                                >
                                                    {isDeleting ? <Loader2 size={18} className="animate-spin" /> : '確認刪除'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <footer className="fixed bottom-0 left-0 right-0 bg-white/70 backdrop-blur-lg border-t border-orange-100/50 py-5 text-center z-10 pointer-events-none">
                        <p className="text-[10px] text-slate-400 font-black tracking-widest uppercase tracking-tighter">Life3 Embrace Grid Game © 2026</p>
                    </footer>
                </div>
            );
        };

        // 啟動 React
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
